{% extends "navbar.html" %}

{% block content %}
<div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8 py-8">
    <form method="post">
        <div class="space-y-12">
            <div class="border-b border-white/10 pb-12">
                <h1 class="text-3xl font-semibold text-white">Open Vault</h1>

                {% if error %}
                <div class="mt-6 rounded-md bg-red-500/10 p-4 border border-red-500/50">
                    <div class="flex">
                        <div class="ml-3">
                            <p class="text-sm font-medium text-red-400">{{ error }}</p>
                        </div>
                    </div>
                </div>
                {% endif %}

                <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                    <div class="sm:col-span-2">
                        <label for="vault_id" class="block text-sm font-medium text-white">Vault ID</label>
                        <div class="mt-2">
                            <input id="vault_id" type="text" name="vault_id" placeholder="Ex: 1"
                                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
                        </div>
                    </div>

                    <div class="col-span-full">
                        <label for="secret" class="block text-sm font-medium text-white">Secret to open the vault</label>
                        <div class="mt-2">
                            <textarea id="secret" name="secret" rows="6" placeholder="Paste the Base64 key, password, or full RSA PEM private key here"
                                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"></textarea>
                        </div>
                        
                        <div class="mt-4 rounded-lg bg-indigo-500/5 p-4 border border-indigo-500/20">
                            <h3 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Expected formats:</h3>
                            <ul class="mt-2 list-disc list-inside text-sm text-gray-400 space-y-1">
                                <li><span class="text-gray-300">Symmetric Mode:</span> AES key in Base64</li>
                                <li><span class="text-gray-300">Password Mode:</span> Original password</li>
                                <li><span class="text-gray-300">RSA Mode:</span> Full RSA PEM private key</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 flex items-center justify-end gap-x-6">
            <a href="{{ url_for('open_vault') }}" class="text-sm font-semibold text-white hover:text-gray-300">Cancel</a>
            <button type="submit"
                class="rounded-md bg-indigo-500 px-6 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 transition-colors">
                Open Vault
            </button>
        </div>
    </form>
</div>
{% endblock %}
