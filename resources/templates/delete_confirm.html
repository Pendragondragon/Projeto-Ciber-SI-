<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Delete Vault</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 flex items-center justify-center px-4">
    <!-- BACKGROUND LAYERS -->
    <div class="absolute inset-0 -z-10">

        <!-- Base gradient -->
        <div class="absolute inset-0 bg-gradient-to-br from-gray-950 via-gray-900 to-black"></div>

        <!-- Top blob -->
        <div class="absolute -top-40 left-1/2 w-[60rem] h-[60rem] -translate-x-1/2
                    bg-gradient-to-tr from-red-600/30 via-rose-500/20 to-purple-500/20
                    blur-3xl opacity-40 rounded-full"></div>

        <!-- Bottom blob -->
        <div class="absolute w-[50rem] h-[50rem]
                    bg-gradient-to-tr from-orange-500/20 via-red-500/20 to-pink-500/20
                    blur-3xl opacity-30 rounded-full"></div>

        <!-- Noise / subtle overlay -->
        <div class="absolute inset-0 opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/dark-mosaic.png')]"></div>

    </div>

    <div class="w-full max-w-md bg-gray-900 border border-red-500/20 rounded-2xl shadow-2xl p-8">

        <div class="flex items-center justify-center mb-6">

            <div class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center border border-red-500/20">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-8 h-8 text-red-500"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 7L5 7M10 11V17M14 11V17M9 7V4H15V7M6 7H18L17 20H7L6 7Z" />
                </svg>

            </div>

        </div>

        <h1 class="text-3xl font-bold text-white text-center mb-4">
            Delete Vault
        </h1>

        <p class="text-gray-400 text-center leading-relaxed mb-8">
            Are you sure you want to permanently delete this vault?
            This action cannot be undone.
        </p>

        <button
            id="deleteButton"
            onclick="confirmDelete()"
            class="w-full bg-red-600 hover:bg-red-700 transition-all duration-200 text-white font-semibold py-3 rounded-xl shadow-lg"
        >
            Confirm Delete
        </button>

        <p id="message"
           class="text-center text-sm mt-5 text-gray-400 hidden">
        </p>

    </div>

    <script>

        async function confirmDelete() {

            const button = document.getElementById("deleteButton");
            const message = document.getElementById("message");

            button.disabled = true;

            button.innerHTML = `
                <div class="flex items-center justify-center gap-3">
                    <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    <span>Deleting...</span>
                </div>
            `;

            const params = new URLSearchParams(window.location.search);

            const token = params.get("token");
            const vault_id = params.get("vault_id");

            try {

                const response = await fetch("/vault/delete-confirm", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token,
                        vault_id
                    })
                });

                const data = await response.json();

                message.classList.remove("hidden");

                if (data.success) {

                    message.className =
                        "text-center text-sm mt-5 text-green-400";

                    message.innerText = data.message;

                    setTimeout(() => {
                        window.location.href = "/";
                    }, 2000);

                } else {

                    message.className =
                        "text-center text-sm mt-5 text-red-400";

                    message.innerText = data.error;

                    button.disabled = false;

                    button.innerHTML = "Confirm Delete";
                }

            } catch (error) {

                message.classList.remove("hidden");

                message.className =
                    "text-center text-sm mt-5 text-red-400";

                message.innerText =
                    "Something went wrong.";

                button.disabled = false;

                button.innerHTML = "Confirm Delete";
            }
        }

    </script>

</body>
</html>
