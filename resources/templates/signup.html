<!doctype html>
<html class="h-full bg-gray-900">
  <head>
    <title>Sign Up</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="{{ url_for('static', filename='css/input.css') }}"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="{{ url_for('static', filename='js/toast.js') }}"
      defer
    ></script>
    <script
      src="{{ url_for('static', filename='js/registo.js') }}"
      defer
    ></script>
  </head>

  <body class="h-full">
    <div
      id="loadingSpinner"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50"
    >
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-gray-300 border-t-indigo-500"
      ></div>
    </div>

    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
      <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <h2
          class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-white"
        >
          Create your account
        </h2>
      </div>

      <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
        <form id="registo-form" action="#" method="POST" class="space-y-6">
          <div>
            <label
              for="username"
              class="block text-sm/6 font-medium text-gray-100"
              >Username</label
            >
            <div class="mt-2">
              <input
                id="username"
                type="text"
                name="username"
                required
                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
                required
              />
            </div>
          </div>
          <div>
            <label for="email" class="block text-sm/6 font-medium text-gray-100"
              >Email Address</label
            >
            <div class="mt-2">
              <input
                id="email"
                type="email"
                name="email"
                required
                autocomplete="email"
                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
                required
              />
            </div>
          </div>
          <div>
            <label
              for="password"
              class="block text-sm/6 font-medium text-gray-100"
              >Password</label
            >
            <div class="mt-2">
              <input
                id="password"
                type="password"
                name="password"
                required
                autocomplete="new-password"
                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
                required
              />
            </div>
          </div>
          <div>
            <label
              for="confirmpassword"
              class="block text-sm/6 font-medium text-gray-100"
              >Confirm Password</label
            >
            <div class="mt-2">
              <input
                id="confirmpassword"
                type="password"
                name="confirmpassword"
                required
                autocomplete="new-password"
                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
                required
              />
            </div>
          </div>
          <div>
            <button
              type="submit"
              class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
            >
              Sign up
            </button>
          </div>
        </form>

        <p class="mt-10 text-center text-sm/6 text-gray-400">
          Already a member?
          <a
            href="{{ url_for('login')}}"
            class="font-semibold text-indigo-400 hover:text-indigo-300"
            >Sign In</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
